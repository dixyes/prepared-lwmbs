name: Linux build

on:
  push:
    branches:
      - latest
  workflow_dispatch:

permissions:
  contents: read

env:
  # date of the pinned pypa base image tags, keep in sync with the Dockerfiles
  BASE_DATE: "2026.10.25"
  LWMBS_REPO: https://github.com/dixyes/lwmbs.git
  LWMBS_BRANCH: master
  IMAGE_NAME: ghcr.io/dixyes/prepared-lwmbs

jobs:
  resolve:
    name: Resolve lwmbs revision
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - name: Resolve lwmbs revision
        id: rev
        run: |
          rev=$(git ls-remote --heads "$LWMBS_REPO" "$LWMBS_BRANCH" | cut -f1)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

  linux:
    name: Build ${{ matrix.variant }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # native build on a matching architecture runner
          - variant: linux-glibc-x86_64
            runner: ubuntu-latest
          - variant: linux-glibc-aarch64
            runner: ubuntu-24.04-arm
          - variant: linux-musl-x86_64
            runner: ubuntu-latest
          - variant: linux-musl-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.variant }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.variant }}
            ${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ env.BASE_DATE }}-${{ needs.resolve.outputs.rev }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Pull image
        run: |
          docker pull "$IMAGE_NAME:${{ matrix.variant }}"
          docker pull "$IMAGE_NAME:${{ matrix.variant }}-$BASE_DATE-${{ needs.resolve.outputs.rev }}"

      - name: Check image
        run: |
          docker run --rm "$IMAGE_NAME:${{ matrix.variant }}" sh -c '
            set -ex
            gcc --version | head -1
            php --version | head -1
            cmake --version | head -1
            re2c --version
            node --version
            npm --version
          '

      - name: Verify tags
        run: |
          moving="$IMAGE_NAME:${{ matrix.variant }}"
          pinned="$IMAGE_NAME:${{ matrix.variant }}-$BASE_DATE-${{ needs.resolve.outputs.rev }}"
          docker image inspect "$moving" > /dev/null
          docker image inspect "$pinned" > /dev/null
          test "$(docker image inspect --format '{{.Id}}' "$moving")" = \
            "$(docker image inspect --format '{{.Id}}' "$pinned")"
          docker image ls --filter "reference=$IMAGE_NAME:*"
